name: flutter_local_db
description: "Local database for Flutter on Rust and LMDB 1.0: tables from your own models, Diesel-style queries, joins, transactions and streams, plus simple key-value records."
version: 3.0.3
repository: https://github.com/JhonaCodes/flutter_local_db
issue_tracker: https://github.com/JhonaCodes/flutter_local_db/issues

topics:
  - database
  - storage
  - offline-first
  - lmdb
  - rust

# The native platforms get the prebuilt offline_first_core library through
# the build hook (hook/build.dart); the web gets the IndexedDB key-value API.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  code_assets: ">=1.0.0 <3.0.0"
  # The query language and its runtime.
  db_dsl: ^0.2.3
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ">=1.0.0 <3.0.0"
  logger_rs: ^2.1.1
  path: ^1.9.1
  path_provider: ^2.1.5
  result_controller: ^1.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
